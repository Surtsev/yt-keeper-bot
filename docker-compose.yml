services:
  bot:
    build: .
    container_name: yt_keeper_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - yt_keeper_net
  db:
    image: postgres:16-alpine
    container_name: yt_keeper_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yt_keeper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yt_keeper_net

networks:
  yt_keeper_net:
    driver: bridge

volumes:
  pgdata:
